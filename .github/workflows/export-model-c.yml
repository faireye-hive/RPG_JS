name: Export Warrior C T-pose for Mixamo
on:
  push:
    branches: [feature/warrior-c-mixamo-tpose-export]
    paths:
      - 'src/studio/WarriorCTposeExport.js'
      - 'scripts/build-warrior-c-tpose.mjs'
      - '.github/workflows/export-model-c.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run export:model-c
      - name: Verify exported OBJ/ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('public/models')
          obj=root/'guerreiro-c-tpose.obj'
          lines=obj.read_text(encoding='utf-8').splitlines()
          numv=sum(x.startswith('v ') for x in lines)
          numf=sum(x.startswith('f ') for x in lines)
          print('vertices:',numv,'faces:',numf)
          assert numv>1000 and numf>1000
          assert sum(x.startswith('o ') for x in lines)==1
          assert (root/'guerreiro-c-tpose.zip').stat().st_size>1000
          with ZipFile(root/'guerreiro-c-tpose.zip') as z:
              assert 'guerreiro-c-tpose.obj' in z.namelist()
              assert z.getinfo('guerreiro-c-tpose.obj').file_size==obj.stat().st_size
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Guerreiro-C-Tpose-OBJ-Mixamo
          path: |
            public/models/guerreiro-c-tpose.obj
            public/models/guerreiro-c-tpose.mtl
            public/models/guerreiro-c-tpose.zip
            public/models/guerreiro-c-tpose-stats.json
          retention-days: 30
      - name: Commit generated OBJ and ZIP to the feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/guerreiro-c-tpose.obj \
                  public/models/guerreiro-c-tpose.mtl \
                  public/models/guerreiro-c-tpose.zip \
                  public/models/guerreiro-c-tpose-stats.json \
                  public/models/guerreiro-c-tpose-LEIA-ME.txt
          if ! git diff --cached --quiet; then
            git commit -m "assets: bake Warrior C T-pose OBJ and ZIP from procedural geometry"
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo 'T-pose assets already up to date'
          fi
